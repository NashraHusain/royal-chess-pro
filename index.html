<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Chess: Pro Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>Royal Chess</h1>
        <div id="status">White's Turn</div>
    </div>

    <div id="game-container">
        <div id="board">
            <div id="promotion-overlay" class="overlay">
                <p>Promote Your Pawn</p>
                <div class="promo-options" id="promo-options"></div>
            </div>
            <div id="win-overlay" class="overlay">
                <h2 id="winner-text">White Wins!</h2>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="reset-btn" onclick="initGame()">Restart Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
